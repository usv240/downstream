<rect x="72" y="502" width="258" height="70" rx="10" fill="#fdf1de" stroke="#9a5b00" stroke-width="1.5"/>
<text x="201.0" y="532.0" text-anchor="middle" font-size="16" font-weight="500" fill="#9a5b00">Raises one question</text>
<text x="201.0" y="552.0" text-anchor="middle" font-size="13" fill="#5d6f80">with both values attached</text>
<rect x="356" y="502" width="258" height="70" rx="10" fill="#fbeae9" stroke="#a8271f" stroke-width="1.5"/>
<text x="485.0" y="532.0" text-anchor="middle" font-size="16" font-weight="500" fill="#a8271f">No flood map drawn</text>
<text x="485.0" y="552.0" text-anchor="middle" font-size="13" fill="#5d6f80">a qualified engineer decides</text>
<rect x="924" y="502" width="258" height="70" rx="10" fill="#fdf1de" stroke="#9a5b00" stroke-width="1.5"/>
<text x="1053.0" y="532.0" text-anchor="middle" font-size="16" font-weight="500" fill="#9a5b00">Stops at owner knowledge</text>
<text x="1053.0" y="552.0" text-anchor="middle" font-size="13" fill="#5d6f80">the one input it may not invent</text>
<text x="769.0" y="532" text-anchor="middle" font-size="13" fill="#5d6f80">An owner answer is pseudonymised</text>
<text x="769.0" y="551" text-anchor="middle" font-size="13" fill="#5d6f80">before it reaches a model.</text>
