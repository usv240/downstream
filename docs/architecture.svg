<rect x="72" y="388" width="258" height="70" rx="10" fill="#ffffff" stroke="#c7d3df" stroke-width="1.5"/>
<text x="201.0" y="418.0" text-anchor="middle" font-size="16" font-weight="650" fill="#16222e">5  Sources disagree?</text>
<text x="201.0" y="438.0" text-anchor="middle" font-size="13" fill="#5d6f80">drawing 31 ft, registry 28 ft</text>
<rect x="356" y="388" width="258" height="70" rx="10" fill="#fdf1de" stroke="#9a5b00" stroke-width="1.5"/>
<text x="485.0" y="418.0" text-anchor="middle" font-size="16" font-weight="650" fill="#9a5b00">6  Mapping gate</text>
<text x="485.0" y="438.0" text-anchor="middle" font-size="13" fill="#5d6f80">three conditions, fails closed</text>
<rect x="640" y="388" width="258" height="70" rx="10" fill="#ffffff" stroke="#c7d3df" stroke-width="1.5"/>
<text x="769.0" y="418.0" text-anchor="middle" font-size="16" font-weight="650" fill="#16222e">7  Schedule its follow-ups</text>
<text x="769.0" y="438.0" text-anchor="middle" font-size="13" fill="#5d6f80">durable records, not browser timers</text>
<rect x="924" y="388" width="258" height="70" rx="10" fill="#ffffff" stroke="#c7d3df" stroke-width="1.5"/>
<text x="1053.0" y="418.0" text-anchor="middle" font-size="16" font-weight="650" fill="#16222e">8  Compose the sections</text>
<text x="1053.0" y="438.0" text-anchor="middle" font-size="13" fill="#5d6f80">each one names its evidence</text>
