<rect x="72" y="276" width="258" height="70" rx="10" fill="#ffffff" stroke="#c7d3df" stroke-width="1.5"/>
<text x="201.0" y="298.0" text-anchor="middle" font-size="16" font-weight="650" fill="#16222e">1  Resolve the record</text>
<text x="201.0" y="317.0" text-anchor="middle" font-size="13" fill="#5d6f80">the console preset is synthetic</text>
<text x="201.0" y="336.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f4a">USACE NID  ·  external, live from the API</text>
<rect x="356" y="276" width="258" height="70" rx="10" fill="#ffffff" stroke="#c7d3df" stroke-width="1.5"/>
<text x="485.0" y="298.0" text-anchor="middle" font-size="16" font-weight="650" fill="#16222e">2  Read the 1958 drawing</text>
<text x="485.0" y="317.0" text-anchor="middle" font-size="13" fill="#5d6f80">a quote kept for every fact</text>
<text x="485.0" y="336.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f4a">Vertex AI  ·  Gemini 3.5 Flash, live</text>
<rect x="640" y="276" width="258" height="70" rx="10" fill="#fdf1de" stroke="#9a5b00" stroke-width="1.5"/>
<text x="769.0" y="306.0" text-anchor="middle" font-size="16" font-weight="650" fill="#9a5b00">3  Quarantine gate</text>
<text x="769.0" y="326.0" text-anchor="middle" font-size="13" fill="#5d6f80">strips instruction-shaped text</text>
<rect x="924" y="276" width="258" height="70" rx="10" fill="#fdf1de" stroke="#9a5b00" stroke-width="1.5"/>
<text x="1053.0" y="306.0" text-anchor="middle" font-size="16" font-weight="650" fill="#9a5b00">4  Quote gate</text>
<text x="1053.0" y="326.0" text-anchor="middle" font-size="13" fill="#5d6f80">a fact must quote its source</text>
