<text x="1014.0" y="153.0" text-anchor="middle" font-size="16" font-weight="650" fill="#2b5c8a">Owner returns to a saved workspace</text>
<text x="1014.0" y="173.0" text-anchor="middle" font-size="13" fill="#5d6f80">days or weeks later</text>
<rect x="50" y="228" width="1140" height="476" rx="14" fill="#f4f7fa" stroke="#c7d3df" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="68" y="255" font-size="14" font-weight="700" letter-spacing="0.8" fill="#2b5c8a">CLOUD RUN  ·  THE AGENT</text>
<text x="1172" y="255" text-anchor="end" font-size="13" fill="#5d6f80">FastAPI, Python 3.12</text>
