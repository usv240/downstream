<rect x="924" y="782" width="258" height="62" rx="10" fill="#ffffff" stroke="#c7d3df" stroke-width="1.5"/>
<text x="1053.0" y="808.0" text-anchor="middle" font-size="16" font-weight="650" fill="#16222e">Keys and quotas</text>
<text x="1053.0" y="828.0" text-anchor="middle" font-size="13" fill="#5d6f80">hashed, per-network limits</text>
<rect x="72" y="866" width="1110" height="74" rx="10" fill="#e6f2ec" stroke="#1f6f4a" stroke-width="1.5"/>
<text x="627.0" y="898.0" text-anchor="middle" font-size="16" font-weight="650" fill="#1f6f4a">The autonomy receipt is counted from this stored timeline, not asserted</text>
<text x="627.0" y="918.0" text-anchor="middle" font-size="13" fill="#5d6f80">15 agent steps  ·  7 owner-authority steps  ·  0 clicks  ·  every step records which actor performed it</text>
