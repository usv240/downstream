<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Downstream architecture</title><desc id="desc">USACE data, a synthetic drawing, and owner sessions become provenance-bearing facts in Firestore. A composer, verifier, and fail-closed mapping gate produce a reviewable draft in Cloud Run.</desc>
  <rect width="1400" height="620" fill="#f7f9fc"/><g font-family="Segoe UI,Arial,sans-serif" fill="#102033">
  <text x="70" y="65" font-size="30" font-weight="700">Downstream architecture</text><text x="70" y="96" font-size="16" fill="#526174">A stateful partner with evidence and authority boundaries</text>
  <g stroke="#d7e0eb" stroke-width="2" fill="#fff"><rect x="70" y="145" rx="16" width="240" height="100"/><rect x="70" y="330" rx="16" width="240" height="100"/><rect x="390" y="145" rx="16" width="250" height="100"/><rect x="390" y="330" rx="16" width="250" height="100"/><rect x="720" y="220" rx="16" width="250" height="125" fill="#e5f3ed" stroke="#116149"/><rect x="1050" y="145" rx="16" width="270" height="100"/><rect x="1050" y="330" rx="16" width="270" height="100"/><rect x="720" y="460" rx="16" width="250" height="100" fill="#fdecec" stroke="#a33131"/></g>
  <g font-size="16" text-anchor="middle"><text x="190" y="186" font-weight="700">USACE NID</text><text x="190" y="214" fill="#526174">live, read-only public fields</text><text x="190" y="371" font-weight="700">Synthetic drawing</text><text x="190" y="399" fill="#526174">Gemini 3.5, graded 5/5</text><text x="515" y="186" font-weight="700">Registry and quote gate</text><text x="515" y="214" fill="#526174">provenance before use</text><text x="515" y="371" font-weight="700">Owner partner loop</text><text x="515" y="399" fill="#526174">ask, remember, adapt</text><text x="845" y="263" font-weight="700">Firestore workspace</text><text x="845" y="292" fill="#526174">facts, profile, sessions,</text><text x="845" y="317" fill="#526174">sections, mapping decision</text><text x="1185" y="186" font-weight="700">Composer and Verifier</text><text x="1185" y="214" fill="#526174">contained citations only</text><text x="1185" y="371" font-weight="700">Cloud Run product</text><text x="1185" y="399" fill="#526174">accessible reviewable draft</text><text x="845" y="501" font-weight="700">Mapping safe stop</text><text x="845" y="529" fill="#526174">flow path only, no extent</text></g>
  <g stroke="#116149" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M310 195 H390"/><path d="M310 380 H390"/><path d="M640 195 C690 195 680 252 720 252"/><path d="M640 380 C690 380 680 314 720 314"/><path d="M970 252 C1015 252 1000 195 1050 195"/><path d="M1185 245 V330"/><path d="M845 345 V460"/><path d="M970 510 C1020 510 1000 410 1050 410"/></g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#116149"/></marker></defs>
  </g></svg>
