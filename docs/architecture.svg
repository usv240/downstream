<text x="1422.0" y="530.0" text-anchor="middle" font-size="16" font-weight="650" fill="#16222e">Cloud Trace</text>
<text x="1422.0" y="550.0" text-anchor="middle" font-size="13" fill="#5d6f80">OpenTelemetry spans for every run</text>
<rect x="1236" y="580" width="372" height="100" rx="10" fill="#fdf1de" stroke="#9a5b00" stroke-width="1.5"/>
<text x="1422.0" y="614" text-anchor="middle" font-size="16" font-weight="650" fill="#9a5b00">Fail-closed by design</text>
<text x="1422.0" y="638" text-anchor="middle" font-size="13" fill="#5d6f80">A gate that cannot prove its</text>
<text x="1422.0" y="657" text-anchor="middle" font-size="13" fill="#5d6f80">conditions stops, and says who</text>
<text x="1422.0" y="676" text-anchor="middle" font-size="13" fill="#5d6f80">decides instead.</text>
