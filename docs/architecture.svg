<text x="250.0" y="173.0" text-anchor="middle" font-size="13" fill="#5d6f80">no key, no account</text>
<rect x="454" y="132" width="356" height="52" rx="10" fill="#e8f0f8" stroke="#2b5c8a" stroke-width="1.5"/>
<text x="632.0" y="153.0" text-anchor="middle" font-size="16" font-weight="650" fill="#2b5c8a">API client</text>
<text x="632.0" y="173.0" text-anchor="middle" font-size="13" fill="#5d6f80">self-serve key in about a second</text>
