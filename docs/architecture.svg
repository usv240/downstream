<text x="50" y="50" font-size="27" font-weight="750" fill="#16222e">Downstream</text>
<text x="50" y="76" font-size="16" fill="#5d6f80">How one request becomes a reviewable emergency action plan. Everything runs on Google Cloud in us-central1, except the one box marked external.</text>
<rect x="50" y="100" width="1140" height="96" rx="14" fill="#f4f7fa" stroke="#c7d3df" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="68" y="127" font-size="14" font-weight="700" letter-spacing="0.8" fill="#2b5c8a">A RUN STARTS FROM AN EVENT, NEVER A BUTTON</text>
<text x="1172" y="127" text-anchor="end" font-size="13" fill="#5d6f80">0 clicks needed to keep it going</text>
<rect x="72" y="132" width="356" height="52" rx="10" fill="#e8f0f8" stroke="#2b5c8a" stroke-width="1.5"/>
